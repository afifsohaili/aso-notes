services:
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: aso-notes-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: aso_notes_development
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - aso-notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aso_notes_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aso-notes-redis
    ports:
      - "6379:6379"
    volumes:
      - aso-notes-redis-data:/data

volumes:
  aso-notes-db-data:
  aso-notes-redis-data:
